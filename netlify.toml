# Netlify builds the site from this file, not from the dashboard settings.
# Vite 8 needs Node 20.19 or 22.12 and up; Netlify's default image is older.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /demo is the self-playing demo page (demo.html), same app, looping.
[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200
